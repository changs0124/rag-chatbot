# gitleaks 설정 - CI 의 시크릿 스캔(`gitleaks git .`)이 루트에서 자동으로 읽는다.
#
# 기본 규칙을 그대로 쓰되, **오탐만** 좁게 허용한다. 규칙을 끄거나 경로를 통째로 빼지 않는다 —
# 그렇게 하면 그 파일에 진짜 키가 들어와도 조용히 통과한다.

[extend]
useDefault = true

# 관리자 임시 비밀번호의 **예시값**. FEAT-ADMIN-003 이 발급하는 값의 생김새를 문서와 테스트가
# 보여줘야 하는데, `temporaryPassword: "..."` 형태가 generic-api-key 규칙에 걸린다.
# 값 자체를 지어낸 것이라 실물이 아니고, 서버는 평문을 저장조차 하지 않는다.
#
# **값을 정확히 지정한다.** 키 이름(`temporaryPassword`)이나 경로로 넓게 빼면 나중에 그 자리에
# 실제 값이 들어와도 걸리지 않는다. 새 예시값을 쓰면 여기도 함께 늘려야 한다 - 그 번거로움이
# "예시값을 함부로 늘리지 않는다"는 방향으로 작용하므로 의도한 마찰이다.
#
# 히스토리를 훑는 스캔이라 파일에서 값을 고쳐도 옛 커밋에 남아 계속 걸린다.
# 되돌리려면 이 항목을 지우는 것이 아니라 해당 커밋들을 다시 써야 한다.
[allowlist]
description = "관리자 임시 비밀번호 예시값(문서·테스트). 실물이 아님"
regexes = [
  '''Xk7m-Qp29-Vr4t''',
  '''Xk7-mQ2p-9Vr4''',
]
