<!--
  파비콘 정본. 회사 CI(`디인사이트 CI.ai`)의 D 마크만 뽑아 사방 12% 여백을 둔 것이다.
  public/ 의 png · ico 4종은 전부 이 파일에서 파생시킨다 - 절차는
  docs/02_architecture/design-system.md 「파비콘 · 앱 아이콘」에 있다.

  **이 파일은 화면이 불러 가지 않는다.** index.html 이 가리키는 것은 png · ico 이고,
  여기 있는 이유는 래스터를 재생성할 수 있게 벡터를 남겨 두기 위해서다.

  그라데이션 좌표 주의 : gradientUnits="userSpaceOnUse" 는 **참조하는 요소(rect)의 좌표계**에서
  해석된다. rect 가 translate 안에 있으므로 x1/x2 도 translate 안 좌표여야 한다 -
  밖 좌표를 넣으면 접힘면 음영이 그만큼 밀려 화면 안 로고와 달라진다(#151 에서 실제로 겪었다).

  경로 좌표를 손으로 고치지 말 것. 벡터 원본에서 뽑은 값이며, 고칠 일이 생기면 원본에서 다시 뽑는다.
-->
