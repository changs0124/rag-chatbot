<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 주소창 색. canvas 토큰과 손으로 맞춘다 - <meta> 는 CSS 변수를 못 읽는다.
         화면이 라이트 하나라(#191) 바꿔 줄 코드가 없다. 미디어쿼리로 두면 OS 가 다크일 때 주소창만 다크가 된다 -->
    <meta name="theme-color" content="#FBFCFE" />
    <!-- interactive-widget : Android Chrome 에서 키보드가 열리면 레이아웃 자체를 줄여 100dvh 가 따라오게 한다.
         없으면 보이는 영역만 줄어 채팅 헤더가 위로 밀려 나간다(#221). Safari 는 무시한다 - ChatPage 가 따로 맞춘다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>RAG 챗봇</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
