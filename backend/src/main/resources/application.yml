spring:
  application:
    name: rag-chatbot-backend
  mvc:
    async:
      # 스트림 수명은 SSE emitter가 단독 관장. MVC async 타임아웃을 끔
      request-timeout: -1
  datasource:
    # 실 DB 접속. 테스트는 AbstractPgIntegrationTest 가 Testcontainers 주소와 런타임 계정(ragapp, #415)을 @DynamicPropertySource 로 넣음
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # 타입별 상한(이미지 10MB/문서 25MB)은 코드가 400으로 먼저 검사. 이 하드 한도 초과는 413.
      # **코드 상한보다 높게 둔다** - 같으면 멀티파트가 먼저 걷어차 코드의 400 검사가 죽은 분기가 되고,
      # 사용자는 무엇이 문제인지 밝히는 400 대신 413 만 받는다(#35). 1MB 여유가 그 역할이다
      max-file-size: 26MB
      max-request-size: 31MB
  # Flyway : 스키마의 소유자는 마이그레이션 SQL. 기동 시 자동 적용 - 켜기 · 위치(db/migration)가 Boot 기본값이라 키를 두지 않는다
  # 마이그레이션 계정은 SPRING_FLYWAY_USER/PASSWORD 로 따로 줄 수 있다(#415) - 없으면 위 datasource 계정을 쓴다.
  # 따로 주면 앱은 DML 만 가진 런타임 계정으로 접속하고, 그 권한은 db/migration/afterMigrate.sql 이 기동마다 맞춘다
  flyway:
    placeholders:
      "[runtime_user]": ${spring.datasource.username:}

# MyBatis - snake_case DB 컬럼 ↔ camelCase 자바 프로퍼티, uuid 전용 TypeHandler 등록
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.ragchatbot.repository.handler

server:
  # PORT → SERVER_PORT → 8080 순
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    # 멀티파트 한도를 넘긴 요청의 **남은 본문**을 여기까지 읽어 버린 뒤 413 을 내려보낸다.
    # 미설정이면 기본 2MiB 라, 26MB 를 넘긴 요청은 남은 양이 그보다 많아 Tomcat 이 연결을 끊고
    # 클라이언트는 413 대신 I/O 오류를 받았다 - api.md 가 약속한 413 이 관측되지 않았다(#64·#70).
    #
    # **32MB 인 이유** : max-request-size(31MB)보다 커야 서버가 받아 줄 여지가 있는 구간 전체가
    # 413 으로 덮인다. 1MB 여유는 max-file-size(26MB)가 코드 상한(25MB)보다 1MB 큰 것과 같은 역할이다.
    #
    # **-1(무제한)로 두지 않는다.** 경계는 사라지지만 거절하기로 이미 정한 요청의 본문을 끝까지
    # 읽는다 - Tomcat 이 2MiB 를 기본값으로 둔 이유가 그것이다. 32MB 를 넘기면 여전히 연결이
    # 끊기며, 그 사실은 api.md 오류 코드 표에 적어 뒀다(#70 에서 45MB 로 실측)
    max-swallow-size: 32MB

# 실행 모드 : mock | live (P-2). **기본값 없음** - 미설정이면 기동 실패(AppModeGuard).
# 목업이 우연히 켜지는 경로를 없애려는 명시 옵트인임
app:
  mode: ${APP_MODE:}
  auth:
    # 계정 발급을 허용할 이메일 도메인(콤마 구분, @ 없이). **APP_MODE=live 에서는 필수** -
    # 비우면 기동에 실패함(FEAT-AUTH-001). 근거는 EmailDomainPolicy 머리 주석.
    # mock 에서는 비워도 되며 그때는 전원 허용임
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:}
  admin:
    # 관리자 이메일 명단(콤마 구분). 기동 시 이 명단으로 users.role 을 맞춤 -
    # 명단에 있으면 admin, **빠지면 user 로 내림**. 앱에 권한 상승 API 는 두지 않음(FEAT-ADMIN-001).
    # 비우면 관리자 0명이며 기동은 정상임
    emails: ${ADMIN_EMAILS:}
  openai:
    # 실 연동(APP_MODE=live)에서만 사용. 공용 Vector Store를 env로 지정(대화별 스토어 대신, 공용 Store 결정)
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-sol}
    vector-store-id: ${OPENAI_VECTOR_STORE_ID:}
    # 스트리밍(/responses) 읽기 타임아웃. app.chat.sse-timeout-ms 보다 작아야 함(기동 실패) - 근거는 OpenAiRealService 생성자
    stream-read-timeout-ms: ${OPENAI_STREAM_READ_TIMEOUT_MS:540000}
    # 그 밖의 호출(문서 업로드·상태 조회·삭제) 읽기 타임아웃. 스트리밍이 아니므로 짧다(#92)
    request-timeout-ms: ${OPENAI_REQUEST_TIMEOUT_MS:30000}
    # 테스트 훅 - env 로 노출하지 않음(이유는 OpenAiRealService.restClient 주석)
    base-url: https://api.openai.com/v1
  mock:
    # 테스트 훅 - env 로 노출하지 않음. 목업 토큰당 지연(ms) - 타이핑 효과용이며 테스트는 0
    token-delay-ms: 45
  cors:
    # 프론트 출처(개발: Vite 5173). 배포 시 실제 도메인으로 교체
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    # SSE emitter 타임아웃이 스트림 수명을 단독 결정(기본 10분)
    sse-timeout-ms: ${SSE_TIMEOUT_MS:600000}
    # back-pressure - 동시 스트림 상한. 초과는 큐에 쌓지 않고 429로 거절함.
    # 이 값은 chatExecutor 풀 크기이기도 함(ChatExecutorConfig · ChatConcurrencyLimiter 가 같은 키를 읽음).
    # 둘이 갈려 상한이 풀보다 크면 초과분이 큐에 쌓여 응답 한 바이트 없이 SSE 타임아웃까지 기다림
    # 16 : 동시 16명 실측은 backend.md 「유량 제어」(#278)
    max-concurrent-streams: ${CHAT_MAX_CONCURRENT_STREAMS:16}
    # 사용자별 동시 스트림. 화면이 한 번에 하나만 쓰므로 1 - 한 사용자가 풀을 독점하지 못하게 함
    max-concurrent-per-user: ${CHAT_MAX_CONCURRENT_PER_USER:1}
    # 모델에 함께 보낼 이전 대화 이력의 토큰 예산. 개수가 아니라 예산인 이유는 메시지 길이 편차가
    # 커서 "최근 N개"가 턴당 비용을 예측하지 못하기 때문임. 과거 이미지는 재전송하지 않음
    history-token-budget: ${CHAT_HISTORY_TOKEN_BUDGET:6000}
    # 입력 길이 상한(trim 뒤 코드 포인트, #371). 넘으면 400 - 메시지는 저장·모델 호출 전, 제목은 생성·변경 모두.
    # 분당 상한은 횟수만, 이력 예산은 이전 메시지만 묶어 이번 메시지의 크기는 이 값이 묶음. 프론트 입력창도 같은 값
    max-message-chars: ${CHAT_MAX_MESSAGE_CHARS:4000}
    max-title-chars: ${CHAT_MAX_TITLE_CHARS:100}
    # 메시지 1건당 첨부 개수 상한(#401). 이미지는 전부 base64 로 바뀌어 한꺼번에 힙에 오르므로(장당 최대 약 13MB)
    # 이 값이 요청 하나의 메모리를 묶음. 중복 id 는 접은 뒤 셈. 프론트 입력창도 같은 값
    max-attachments: ${CHAT_MAX_ATTACHMENTS:5}
  user:
    # 표시 이름 길이 상한(trim 뒤 코드 포인트, #413). 넘으면 400 - 이름 변경·계정 발급 모두. /api/auth/me · 사용자 목록 ·
    # 문서 목록이 이름을 매번 실어 보내므로 상한이 없으면 응답 크기가 이름 크기를 따라감. 프론트 입력창도 같은 값
    max-name-chars: ${USER_MAX_NAME_CHARS:50}
  ratelimit:
    # 사용자별 분당 채팅 상한(비용 통제, REQ-OPS-003). 단일 인스턴스 전제
    chat-per-minute: ${RATELIMIT_CHAT_PER_MINUTE:20}
    # 계정별 분당 로그인 시도 상한(대입 지연). 키는 정규화된 이메일 - IP 기준이 아님
    login-per-minute: ${RATELIMIT_LOGIN_PER_MINUTE:10}
    # 사용자별 분당 첨부 업로드 상한(#95). 채팅보다 높은 이유는 한 메시지에 이미지를 여러 장 붙이는
    # 것이 정상 사용이기 때문. 업로드는 크기 검사(10MB, #402)를 통과한 파일을 힙에 올리므로 이 상한이
    # 병렬도를 묶음. 디스크는 아래 attachment-quota-mb(#418)가 묶음
    upload-per-minute: ${RATELIMIT_UPLOAD_PER_MINUTE:30}
    # 사용자별 분당 비밀번호 변경 상한(#95). 매 호출이 BCrypt 를 두 번 돌아 CPU 를 먹음.
    # 정상 사용은 가끔 한 번이라 낮아도 막히지 않음
    password-change-per-minute: ${RATELIMIT_PASSWORD_CHANGE_PER_MINUTE:5}
    # 카운터 키 총량 상한. 넘으면 가장 오래 안 쓴 키부터 축출해 메모리를 유계로 둠.
    # 축출은 곧 카운터 리셋이라는 약화가 따름 - 사유는 docs/02_architecture/overview.md 「알려진 제약」
    max-keys: ${RATELIMIT_MAX_KEYS:10000}
  file:
    # 파일 저장 루트(로컬/서버 디스크). S3 교체 시 FileStorage 구현만 교체
    storage-root: ${FILE_STORAGE_ROOT:./uploads}
    # 고아(미연결) 첨부 회수 - 유예 시간과 주기. 유예는 10분 아래로 내려가지 않음(FileService.MIN_ORPHAN_AGE_MINUTES) -
    # 작성 중인 첨부를 지우지 않게, 그보다 최근 것은 어떤 cutoff 로도 지우지 않음
    orphan-ttl-minutes: ${ORPHAN_TTL_MINUTES:60}
    orphan-cleanup-cron: ${ORPHAN_CLEANUP_CRON:0 0 * * * *}
    # 첨부 서빙용 서명 쿼리 토큰의 수명(분). <img src> 가 헤더를 못 실어 URL 에 토큰을 싣는다
    access-token-ttl-minutes: ${FILE_ACCESS_TOKEN_TTL_MINUTES:15}
    # 사용자별 첨부 저장 한도(MB, #418). 사용자 폴더의 실제 파일 크기 합으로 재고, 넘기는 업로드는 400.
    # 분당 · 장수 상한은 쌓이는 속도만 줄여 uploads 볼륨이 차면 같은 디스크의 Postgres 가 먼저 멎는다
    attachment-quota-mb: ${ATTACHMENT_QUOTA_MB:500}
  doc-figures:
    # 문서 그림 루트(FEAT-CHAT-004). 전처리가 만든 <key>.png 를 둠. 비면 live 는 그림이 전부 404 이고
    # mock 은 classpath mock-figures/ 견본을 씀. 기동은 막지 않음 - 그림은 보조 정보다
    dir: ${DOC_FIGURES_DIR:}
  jwt:
    # 서명 시크릿 - 값은 env로 주입(커밋 금지). 테스트는 test 프로퍼티로 주입
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    # 슬라이딩 재발급 임계(분). 남은 수명이 이보다 적으면 응답 헤더로 새 토큰을 실어 보냄.
    # **0 이면 기능을 끔** - 고정 만료로 동작함
    refresh-threshold-minutes: ${JWT_REFRESH_THRESHOLD_MINUTES:30}
    # 절대 수명(시간, #403). 최초 인증(로그인 · 비밀번호 변경)부터 이만큼 지나면 재발급을 멈춰, 그 뒤 토큰이 만료되면
    # 재로그인이다. 없으면 탈취한 토큰이 비밀번호를 바꾸기 전까지 무기한 이어짐. 실효 최대 = 이 값 + 토큰 수명
    max-session-hours: ${JWT_MAX_SESSION_HOURS:12}
