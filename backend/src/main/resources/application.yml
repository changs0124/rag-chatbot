spring:
  application:
    name: rag-chatbot-backend
  mvc:
    async:
      # P-5 : 스트림 수명은 SSE emitter가 단독 관장. MVC async 타임아웃을 끔
      request-timeout: -1
  datasource:
    # 실 DB 접속(live/local). 테스트는 Testcontainers가 @ServiceConnection으로 주입함
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    # P-4 : 스키마의 소유자는 마이그레이션 SQL. 기동 시 자동 적용
    enabled: true
    locations: classpath:db/migration

# MyBatis - snake_case DB 컬럼 ↔ camelCase 자바 프로퍼티, uuid 전용 TypeHandler 등록
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.ragchatbot.mapper.handler
  type-aliases-package: com.ragchatbot.domain

server:
  # Cloud/컨테이너 대응 - PORT 우선 리슨
  port: ${PORT:${SERVER_PORT:8080}}

# 실행 모드 : mock | live (P-2). 운영 프로필에서 mock이면 기동 실패(AC-18, ProdModeGuard)
app:
  mode: ${APP_MODE:mock}
  jwt:
    # 서명 시크릿 - 값은 env로 주입(커밋 금지). 테스트는 test 프로퍼티로 주입
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
