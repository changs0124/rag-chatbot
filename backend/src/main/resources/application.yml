spring:
  application:
    name: rag-chatbot-backend
  mvc:
    async:
      # P-5 : 스트림 수명은 SSE emitter가 단독 관장. MVC async 타임아웃을 끔
      request-timeout: -1
  datasource:
    # 실 DB 접속(live/local). 테스트는 Testcontainers가 @ServiceConnection으로 주입함
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # 타입별 상한(이미지 10MB/문서 25MB)은 코드가 400으로 먼저 검사. 이 하드 한도 초과는 413.
      # **코드 상한보다 높게 둔다** - 같으면 멀티파트가 먼저 걷어차 코드의 400 검사가 죽은 분기가 되고,
      # 사용자는 무엇이 문제인지 밝히는 400 대신 413 만 받는다(#35). 1MB 여유가 그 역할이다
      max-file-size: 26MB
      max-request-size: 31MB
  flyway:
    # P-4 : 스키마의 소유자는 마이그레이션 SQL. 기동 시 자동 적용
    enabled: true
    locations: classpath:db/migration

# MyBatis - snake_case DB 컬럼 ↔ camelCase 자바 프로퍼티, uuid 전용 TypeHandler 등록
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.ragchatbot.repository.handler
  type-aliases-package: com.ragchatbot.entity

server:
  # Cloud/컨테이너 대응 - PORT 우선 리슨
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    # 멀티파트 한도를 넘긴 요청의 **남은 본문**을 여기까지 읽어 버린 뒤 413 을 내려보낸다.
    # 미설정이면 기본 2MiB 라, 26MB 를 넘긴 요청은 남은 양이 그보다 많아 Tomcat 이 연결을 끊고
    # 클라이언트는 413 대신 I/O 오류를 받았다 - api.md 가 약속한 413 이 관측되지 않았다(#64·#70).
    #
    # **32MB 인 이유** : max-request-size(31MB)보다 커야 서버가 받아 줄 여지가 있는 구간 전체가
    # 413 으로 덮인다. 1MB 여유는 max-file-size(26MB)가 코드 상한(25MB)보다 1MB 큰 것과 같은 역할이다.
    #
    # **-1(무제한)로 두지 않는다.** 경계는 사라지지만 거절하기로 이미 정한 요청의 본문을 끝까지
    # 읽는다 - Tomcat 이 2MiB 를 기본값으로 둔 이유가 그것이다. 32MB 를 넘기면 여전히 연결이
    # 끊기며, 그 사실은 api.md 오류 코드 표에 적어 뒀다(#70 에서 45MB 로 실측)
    max-swallow-size: 32MB

# 실행 모드 : mock | live (P-2). **기본값 없음** - 미설정이면 기동 실패(AC-18, AppModeGuard).
# 목업이 우연히 켜지는 경로를 없애려고 명시 옵트인으로 뒤집었음(2026-07-28 결정)
app:
  mode: ${APP_MODE:}
  auth:
    # 가입을 허용할 이메일 도메인(콤마 구분, @ 없이). **APP_MODE=live 에서는 필수** -
    # 비우면 기동에 실패함(FEAT-AUTH-001). "비면 전원 허용"으로 두면 배포에서 이 변수를
    # 빠뜨렸을 때 조용히 가입이 열려, 아무나 사내 문서 기반 답변을 받게 됨.
    # mock 에서는 비워도 되며 그때는 전원 허용임 - 통합 테스트가 매 케이스 가입하기 때문
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:}
  admin:
    # 관리자 이메일 명단(콤마 구분). 기동 시 이 명단으로 users.role 을 맞춤 -
    # 명단에 있으면 admin, **빠지면 user 로 내림**. 앱에 권한 상승 API 는 두지 않음(FEAT-ADMIN-001).
    # 비우면 관리자 0명이며 기동은 정상임
    emails: ${ADMIN_EMAILS:}
  openai:
    # 실 연동(APP_MODE=live)에서만 사용. 공용 Vector Store를 env로 지정(대화별 스토어 대신, 공용 Store 결정)
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    vector-store-id: ${OPENAI_VECTOR_STORE_ID:}
    # 스트리밍(/responses) 읽기 타임아웃. **app.chat.sse-timeout-ms 보다 작아야 하며, 크거나 같으면
    # 기동에 실패함**(#76·#92) - emitter 가 죽은 뒤에도 워커가 읽기에 붙어 있으면 그동안 스레드와
    # 동시 스트림 권한이 함께 잡혀, 화면에 아무 스트림도 없는데 429 를 받게 됨.
    # 종전에는 하드코딩 10분이라 SSE 타임아웃과 정확히 같았고 결말이 밀리초 경합이었음
    stream-read-timeout-ms: ${OPENAI_STREAM_READ_TIMEOUT_MS:540000}
    # 그 밖의 호출(문서 업로드·상태 조회·삭제) 읽기 타임아웃. 스트리밍이 아니므로 짧다 -
    # 종전에는 클라이언트가 하나뿐이라 10분이 여기에도 걸려, in_progress 3건이면 관리자 목록
    # 요청 하나가 최대 30분 톰캣 스레드를 잡았음
    request-timeout-ms: ${OPENAI_REQUEST_TIMEOUT_MS:30000}
  cors:
    # 프론트 출처(개발: Vite 5173). 배포 시 실제 도메인으로 교체
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    # P-5 : SSE emitter 타임아웃이 스트림 수명을 단독 결정(기본 10분). 참조 착지값
    sse-timeout-ms: ${SSE_TIMEOUT_MS:600000}
    # back-pressure(2026-07-28 결정) - 동시 스트림 상한. 초과는 큐에 쌓지 않고 429로 거절함.
    # 이 값은 chatExecutor 풀 크기이기도 함(ChatExecutorConfig) - 상한이 풀보다 크면 큐가 쌓임
    max-concurrent-streams: ${CHAT_MAX_CONCURRENT_STREAMS:8}
    # 사용자별 동시 스트림. 화면이 한 번에 하나만 쓰므로 1 - 한 사용자가 풀을 독점하지 못하게 함
    max-concurrent-per-user: ${CHAT_MAX_CONCURRENT_PER_USER:1}
    # 모델에 함께 보낼 이전 대화 이력의 토큰 예산. 개수가 아니라 예산인 이유는 메시지 길이 편차가
    # 커서 "최근 N개"가 턴당 비용을 예측하지 못하기 때문임. 과거 이미지는 재전송하지 않음
    history-token-budget: ${CHAT_HISTORY_TOKEN_BUDGET:6000}
  ratelimit:
    # 사용자별 분당 채팅 상한(비용 통제, D-1). 단일 인스턴스 전제(R-6, 미결)
    chat-per-minute: ${RATELIMIT_CHAT_PER_MINUTE:20}
    # 계정별 분당 로그인 시도 상한(대입 지연). 키는 정규화된 이메일 - IP 기준이 아님
    login-per-minute: ${RATELIMIT_LOGIN_PER_MINUTE:10}
    # 사용자별 분당 첨부 업로드 상한(#95). 채팅보다 높은 이유는 한 메시지에 이미지를 여러 장 붙이는
    # 것이 정상 사용이기 때문. 업로드는 파일 전체를 힙에 올리므로 병렬도를 유계로 두지 않으면
    # 26MB × 스레드 수로 OOM 이 나고, uploads 볼륨이 차면 같은 디스크의 Postgres 가 먼저 멎음
    upload-per-minute: ${RATELIMIT_UPLOAD_PER_MINUTE:30}
    # 사용자별 분당 비밀번호 변경 상한(#95). 매 호출이 BCrypt 를 두 번 돌아 CPU 를 먹음.
    # 정상 사용은 가끔 한 번이라 낮아도 막히지 않음
    password-change-per-minute: ${RATELIMIT_PASSWORD_CHANGE_PER_MINUTE:5}
    # 카운터 키 총량 상한(2026-07-28 결정). 넘으면 가장 오래 안 쓴 키부터 축출해 메모리를 유계로 둠.
    # 축출은 곧 카운터 리셋이라는 약화가 따름 - 사유는 docs/02_architecture/overview.md 「알려진 제약」
    max-keys: ${RATELIMIT_MAX_KEYS:10000}
  file:
    # 파일 저장 루트(로컬/서버 디스크, P-7). S3 교체 시 FileStorage 구현만 교체
    storage-root: ${FILE_STORAGE_ROOT:./uploads}
    # 고아(미연결) 첨부 회수 - 유예 시간과 주기. 유예보다 최근 것은 어떤 cutoff 로도 지우지 않음
    orphan-ttl-minutes: ${ORPHAN_TTL_MINUTES:60}
    orphan-cleanup-cron: ${ORPHAN_CLEANUP_CRON:0 0 * * * *}
  jwt:
    # 서명 시크릿 - 값은 env로 주입(커밋 금지). 테스트는 test 프로퍼티로 주입
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    # 슬라이딩 재발급 임계(분). 남은 수명이 이보다 적으면 응답 헤더로 새 토큰을 실어 보냄.
    # **0 이면 기능을 끔** - 종전 고정 만료 동작으로 되돌리는 경로임
    refresh-threshold-minutes: ${JWT_REFRESH_THRESHOLD_MINUTES:30}
