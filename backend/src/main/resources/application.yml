spring:
  application:
    name: rag-chatbot-backend
  mvc:
    async:
      # P-5 : 스트림 수명은 SSE emitter가 단독 관장. MVC async 타임아웃을 끔
      request-timeout: -1
  datasource:
    # 실 DB 접속(live/local). 테스트는 Testcontainers가 @ServiceConnection으로 주입함
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # 타입별 상한(이미지 10MB/문서 20MB)은 코드가 400으로 먼저 검사. 이 하드 한도 초과는 413
      max-file-size: 25MB
      max-request-size: 30MB
  flyway:
    # P-4 : 스키마의 소유자는 마이그레이션 SQL. 기동 시 자동 적용
    enabled: true
    locations: classpath:db/migration

# MyBatis - snake_case DB 컬럼 ↔ camelCase 자바 프로퍼티, uuid 전용 TypeHandler 등록
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.ragchatbot.mapper.handler
  type-aliases-package: com.ragchatbot.domain

server:
  # Cloud/컨테이너 대응 - PORT 우선 리슨
  port: ${PORT:${SERVER_PORT:8080}}

# 실행 모드 : mock | live (P-2). 운영 프로필에서 mock이면 기동 실패(AC-18, ProdModeGuard)
app:
  mode: ${APP_MODE:mock}
  cors:
    # 프론트 출처(개발: Vite 5173). 배포 시 실제 도메인으로 교체
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    # P-5 : SSE emitter 타임아웃이 스트림 수명을 단독 결정(기본 10분). 참조 착지값
    sse-timeout-ms: ${SSE_TIMEOUT_MS:600000}
  ratelimit:
    # 사용자별 분당 채팅 상한(비용 통제, D-1). 단일 인스턴스 전제(R-6, 미결)
    chat-per-minute: ${RATELIMIT_CHAT_PER_MINUTE:20}
  file:
    # 파일 저장 루트(로컬/서버 디스크, P-7). S3 교체 시 FileStorage 구현만 교체
    storage-root: ${FILE_STORAGE_ROOT:./uploads}
  jwt:
    # 서명 시크릿 - 값은 env로 주입(커밋 금지). 테스트는 test 프로퍼티로 주입
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
