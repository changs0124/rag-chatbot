name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvnw verify (test + build)
        run: ./mvnw -B verify

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build

  docs:
    name: docs (참조 실재 검사)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문서 참조 실재 + 위키링크 검사
        run: bash scripts/check-doc-refs.sh
