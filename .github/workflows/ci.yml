name: CI

on:
  push:
    branches: [main]
    # 증거 미러 커밋은 `.issue/**` 만 건드린다(issue-start · issue-end 가 기본 브랜치에 바로 올린다).
    # 코드가 한 줄도 안 바뀐 커밋에 잡을 다 돌릴 이유가 없다.
    #
    # **pull_request 에는 넣지 않는다.** PR 은 코드와 증거가 같이 들어와 어차피 걸리지 않고,
    # paths-ignore 로 건너뛴 워크플로는 required checks 를 걸었을 때 pending 으로 남아 merge 를
    # 영영 막는다. `docs/06_changelog/**` 도 빼지 않는다 - `check-doc-refs.sh` 가 그 경로도
    # 스캔해서, 건너뛰면 CHANGELOG 만 고친 커밋의 깨진 참조가 그대로 통과한다.
    paths-ignore:
      - '.issue/**'
  # **base 를 거르지 않는다(#161).** `branches:` 는 base 를 필터해, 다른 PR 위에 쌓은 PR 은 7잡이
  # 하나도 안 돌고 체크 목록에 흔적도 없이 「통과」로 읽힌다.
  pull_request:
  # **보안 잡(secrets · deps)만 주 1회 더 돈다(#135).** 이 잡들은 변경마다도 돌지만,
  # 코드가 그대로여도 **바깥(취약점 DB · 커밋 이력 전체)이 바뀌면** 답이 달라진다.
  # 이 레인에서는 코드 4잡이 빠진다(각 잡의 `if: != 'schedule'`).
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 KST (UTC 일요일 18:00)
  # **수동 실행은 7잡 전부를 돈다** - 한 번에 전부 확인하는 버튼이다.
  workflow_dispatch:

permissions:
  contents: read

# 연속 푸시 시 이전 run 을 취소함 - 잡 전체가 밀린 커밋마다 겹쳐 도는 것을 막음.
#
# **그룹 키에 event_name 을 넣는다(#129)** - 없으면 `github.ref` 가 셋 다 `refs/heads/main` 이라 push · schedule ·
# workflow_dispatch 가 한 그룹이 되고, 주간 보안 스캔이 main 푸시에 조용히 취소되거나(재시도 없음) 그 반대가 된다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # 시크릿 스캔 도구 - 버전과 체크섬을 함께 고정함(공급망)
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  backend:
    name: backend (test + build + 케이스 수 하한)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 런타임 버전 대조(java)
        run: bash scripts/check-runtime-versions.sh java
      - name: mvnw verify (test + build)
        working-directory: backend
        run: ./mvnw -B verify
      - name: 케이스 수 하한
        run: bash scripts/check-case-floor.sh backend
      # static 잡이 아니라 여기다. JUnit 은 pom.xml 에 없고 Spring Boot BOM 이 관리해서,
      # m2 가 채워진 뒤(= verify 뒤)에만 실제 값을 읽을 수 있음. static 잡은 checkout + bash 뿐임
      - name: 문서 버전 주장 대조
        run: bash scripts/check-doc-versions.sh

  frontend:
    name: frontend (lint + test + build + 케이스 수 하한)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 런타임 버전 대조(node)
        run: bash ../scripts/check-runtime-versions.sh node
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test (vitest)
        # 기본 리포터를 함께 켬(#331) - json 만 주면 기본 리포터가 꺼져, 무엇이 왜 깨졌는지 로그에 안 남음
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json
      - name: Build (tsc + vite)
        run: npm run build
      - name: 케이스 수 하한
        # 스크립트가 스스로 저장소 루트로 이동하므로 frontend/ 에서 실행해도 같음
        run: bash ../scripts/check-case-floor.sh frontend

  docker:
    name: docker (백엔드 이미지 빌드)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드(푸시 없음)
        # 배포 산출물이 조용히 썩는 것을 막음 - pom·소스 구조가 바뀌어 Dockerfile 이 깨지면
        # 정작 배포하는 날이 아니라 여기서 먼저 드러남
        run: docker build -t rag-chatbot-backend:ci backend

  # **backend 잡에 끼우지 않는 이유** : `mvnw verify` 가 죽으면 그 뒤 문서 검사는 돌지 않아, 「테스트만 깨짐」과
  # 「둘 다 깨짐」이 구분되지 않는다. 따로 두면 잡 이름만 보고 안다.
  #
  # **스텝은 합치지 않는다** - 어느 검사가 깨졌는지 스텝 이름으로 드러나야 한다.
  static:
    name: static (셸 구문·분석 · 계약 · 문서 참조 · 섹션 이름)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **제일 먼저 본다(#136)** - 이유는 scripts/check-all.sh 의 같은 자리 주석
      - name: 셸 구문 검사
        run: bash scripts/check-shell-syntax.sh
      # **러너에 shellcheck 가 기본 설치돼 있다** - 설치 스텝이 필요 없다(#145).
      # 스크립트는 도구가 없으면 exit 0 으로 빠지므로, 러너가 바뀌어 사라져도 CI 가
      # 빨간불이 되지는 않는다. 대신 그때는 이 스텝이 "모름"을 찍고 지나간다
      - name: 셸 정적 분석 (shellcheck)
        run: bash scripts/check-shell-lint.sh
      - name: DTO · resultMap · 프론트 타입의 필드 대조
        run: bash scripts/check-response-contract.sh
      # 줄 맨 앞의 충돌 표시를 저장소 전체에서 찾는다 - 이유는 check-merge-markers.sh 머리 주석(#210)
      - name: 병합 충돌 표시
        run: bash scripts/check-merge-markers.sh
      - name: 문서 참조 실재 + 위키링크 검사
        run: bash scripts/check-doc-refs.sh
      # 경로가 아니라 **섹션 이름**을 본다 - 위 검사는 파일이 있으면 통과하므로 없는 섹션을 가리켜도 초록이다(#28).
      # grep 기반이라 JDK·Node 없는 이 잡에서도 돈다
      - name: 문서 섹션 이름 대조
        run: bash scripts/check-doc-sections.sh

  secrets:
    name: secrets (시크릿 스캔)
    # 공개 저장소라 시크릿은 한 번 들어오면 회수할 수 없어 merge 전에 돈다.
    # force-push 시 cancel-in-progress 가 스캔을 끊어도 새 푸시가 다시 돌리므로 실해는 없다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git 이력을 훑으므로 얕은 클론이면 PR 커밋을 못 봄
          fetch-depth: 0
      - name: gitleaks 설치(버전 · 체크섬 고정)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 시크릿 스캔(커밋된 내용 전체)
        run: ./gitleaks git . --no-banner --redact

  deps-backend:
    name: deps (백엔드 의존성 취약점)
    # 의존성을 바꾸는 것은 우리 커밋이라 변경마다 돈다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - pom.xml 스캔
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          # 해석한 패키지를 로그에 남김 - 이게 없으면 "취약점 0건"과
          # "패키지를 한 건도 해석하지 못함"이 로그에서 구분되지 않음
          list-all-pkgs: 'true'

  deps-frontend:
    name: deps (프론트 의존성 취약점)
    # 의존성을 바꾸는 것은 우리 커밋이라 변경마다 돈다.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # npm ci 를 두지 않는다(#331) - npm audit 는 package-lock.json 만 읽어 node_modules 가 필요 없음
      - name: npm audit (high 이상 0건)
        run: npm audit --audit-level=high
