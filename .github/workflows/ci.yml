name: CI

on:
  push:
    branches: [main]
    # 증거 미러 커밋은 `.issue/**` 만 건드린다(issue-start · issue-end 가 기본 브랜치에 바로 올린다).
    # 코드가 한 줄도 안 바뀐 커밋에 잡 8개를 다 돌릴 이유가 없고, 이 저장소는 **비공개라 Actions
    # 분이 유료 한도에 묶인다** - 실제로 이 낭비가 한도를 밀어내 CI 가 통째로 멎은 적이 있다(#127).
    #
    # **pull_request 에는 넣지 않는다.** PR 은 코드와 증거가 같이 들어와 어차피 걸리지 않고,
    # paths-ignore 로 건너뛴 워크플로는 required checks 를 걸었을 때 pending 으로 남아 merge 를
    # 영영 막는다. 얻는 것 없이 그 함정만 들여오는 셈이다.
    #
    # `docs/06_changelog/**` 는 **일부러 빼지 않는다** - `check-doc-refs.sh` 가 그 경로도 스캔해서,
    # 건너뛰면 CHANGELOG 만 고친 커밋의 깨진 참조가 그대로 통과한다.
    paths-ignore:
      - '.issue/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

# 연속 푸시 시 이전 run 을 취소함 - 잡 전체가 밀린 커밋마다 겹쳐 도는 것을 막음
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 시크릿 스캔 도구 - 버전과 체크섬을 함께 고정함(공급망)
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  backend:
    name: backend (test + build + 케이스 수 하한)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 런타임 버전 대조(이관-8)
        run: bash scripts/check-runtime-versions.sh java
      - name: mvnw verify (test + build)
        working-directory: backend
        run: ./mvnw -B verify
      - name: 케이스 수 하한
        run: bash scripts/check-case-floor.sh backend
      # docs 잡이 아니라 여기다. JUnit 은 pom.xml 에 없고 Spring Boot BOM 이 관리해서,
      # m2 가 채워진 뒤(= verify 뒤)에만 실제 값을 읽을 수 있음. docs 잡은 checkout + bash 뿐임
      - name: 문서 버전 주장 대조
        run: bash scripts/check-doc-versions.sh

  frontend:
    name: frontend (lint + test + build + 케이스 수 하한)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 런타임 버전 대조(이관-8)
        run: bash ../scripts/check-runtime-versions.sh node
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test -- --reporter=json --outputFile=vitest-report.json
      - name: Build (tsc + vite)
        run: npm run build
      - name: 케이스 수 하한
        # 스크립트가 스스로 저장소 루트로 이동하므로 frontend/ 에서 실행해도 같음
        run: bash ../scripts/check-case-floor.sh frontend

  docker:
    name: docker (백엔드 이미지 빌드 · main 은 GHCR 푸시)
    runs-on: ubuntu-latest
    # 최상단은 contents: read 다. 패키지 쓰기가 필요한 것은 이 잡뿐이라 여기서만 넓힘
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rag-chatbot-backend
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        # 배포 산출물이 조용히 썩는 것을 막음 - pom·소스 구조가 바뀌어 Dockerfile 이 깨지면
        # 정작 배포하는 날이 아니라 여기서 먼저 드러남. **PR 은 여기까지만 돈다**
        run: docker build -t rag-chatbot-backend:ci backend

      # --- 아래는 main 푸시에서만 -------------------------------------------
      # 배포 서버가 1GB 급이라 거기서 빌드할 수 없다(#127). 이 잡의 산출물이 곧 배포본이다.
      #
      # docker/login-action 대신 `docker login` 을 직접 부른다 - 이 저장소는 서드파티 액션을
      # 커밋 SHA 로 고정하는데(trivy-action), 로그인 한 줄 때문에 고정·갱신할 의존을 하나 더
      # 늘릴 이유가 없다. GITHUB_TOKEN 은 run 단계에 env 로 넘겨 명령줄에 남지 않게 한다
      - name: GHCR 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: 태그 부여 · 푸시
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # latest 는 배포용, SHA 태그는 되돌릴 자리다 - latest 만 두면 어제 것으로 내리지 못한다
        run: |
          set -euo pipefail
          docker tag rag-chatbot-backend:ci "$IMAGE:latest"
          docker tag rag-chatbot-backend:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  contract:
    name: contract (응답 계약 대조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DTO · resultMap · 프론트 타입의 필드 대조
        run: bash scripts/check-response-contract.sh

  docs:
    name: docs (참조 실재)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문서 참조 실재 + 위키링크 검사
        run: bash scripts/check-doc-refs.sh
      # 경로가 아니라 **섹션 이름**을 본다. 위 검사는 파일이 있으면 통과하므로 없는 섹션을 가리켜도
      # 초록이었다(#28 에서 실제로 통과했다). grep 기반이라 이 잡의 JDK·Node 없는 환경에서도 돈다
      - name: 문서 섹션 이름 대조
        run: bash scripts/check-doc-sections.sh

  secrets:
    name: secrets (시크릿 스캔)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git 이력을 훑으므로 얕은 클론이면 PR 커밋을 못 봄
          fetch-depth: 0
      - name: gitleaks 설치(버전 · 체크섬 고정)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 시크릿 스캔(커밋된 내용 전체)
        run: ./gitleaks git . --no-banner --redact

  deps-backend:
    name: deps (백엔드 의존성 취약점)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - pom.xml 스캔
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          # 해석한 패키지를 로그에 남김 - 이게 없으면 "취약점 0건"과
          # "패키지를 한 건도 해석하지 못함"이 로그에서 구분되지 않음
          list-all-pkgs: 'true'

  deps-frontend:
    name: deps (프론트 의존성 취약점)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high 이상 0건)
        run: npm audit --audit-level=high
