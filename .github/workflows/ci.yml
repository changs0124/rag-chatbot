name: CI

on:
  push:
    branches: [main]
    # 증거 미러 커밋은 `.issue/**` 만 건드린다(issue-start · issue-end 가 기본 브랜치에 바로 올린다).
    # 코드가 한 줄도 안 바뀐 커밋에 잡을 다 돌릴 이유가 없다.
    #
    # **pull_request 에는 넣지 않는다.** PR 은 코드와 증거가 같이 들어와 어차피 걸리지 않고,
    # paths-ignore 로 건너뛴 워크플로는 required checks 를 걸었을 때 pending 으로 남아 merge 를
    # 영영 막는다. `docs/06_changelog/**` 도 빼지 않는다 - `check-doc-refs.sh` 가 그 경로도
    # 스캔해서, 건너뛰면 CHANGELOG 만 고친 커밋의 깨진 참조가 그대로 통과한다.
    paths-ignore:
      - '.issue/**'
  # **base 를 거르지 않는다(#161).** 종전에는 `branches: [main]` 이 붙어 있었는데,
  # `pull_request` 의 `branches:` 는 head 가 아니라 **base** 를 필터한다. 그래서 다른 PR 브랜치
  # 위에 쌓은 PR 은 **7잡이 하나도 트리거되지 않았다.** 게다가 필터에 걸린 워크플로는 실패도
  # pending 도 아닌 **「없음」** 이라 체크 목록에 흔적조차 남지 않아, Vercel 하나만 green 인 상태가
  # 그대로 **「통과」로 읽혔다.** 2026-09-11 PR #160 이 실제로 그랬고 머지 직전에 겨우 잡아
  # `gh workflow run` 으로 손수 돌렸다 — 못 잡았으면 게이트를 한 번도 안 거친 코드가 main 에 들어갔다.
  #
  # **`types:` 에 `edited` 를 더하는 쪽은 고르지 않았다.** base 재지정 시점에는 돌지만
  # **스택으로 있는 동안에는 여전히 0잡**이라 구멍이 그대로 남는다.
  #
  # **러너 비용은 근거가 되지 않는다.** 2026-09-11 공개 전환으로 standard runner 분이 무료다 —
  # 아래 secrets · deps 잡을 주 1회에서 변경마다로 되돌린 것(#135)과 같은 근거다.
  pull_request:
  # **보안 잡(secrets · deps)만 주 1회 더 돈다(#135).** 이 잡들은 변경마다도 돌지만,
  # 코드가 그대로여도 **바깥(취약점 DB · 커밋 이력 전체)이 바뀌면** 답이 달라진다.
  # 이 레인에서는 코드 4잡이 빠진다(각 잡의 `if: != 'schedule'`).
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 KST (UTC 일요일 18:00)
  # **수동 실행은 7잡 전부를 돈다** - 스케줄 잡만 고르지 않는다. 오래 CI 를 못 돌린 뒤
  # (한도 소진 등) 한 번에 전부 확인하는 것이 이 버튼의 주 용도이기 때문이다.
  # 비용은 사람이 누를 때만 드므로 통제된다.
  workflow_dispatch:

permissions:
  contents: read

# 연속 푸시 시 이전 run 을 취소함 - 잡 전체가 밀린 커밋마다 겹쳐 도는 것을 막음.
#
# **그룹 키에 event_name 을 넣는다(#129).** 넣지 않으면 `github.ref` 가 세 경우 모두
# `refs/heads/main` 이라 **push · schedule · workflow_dispatch 가 한 그룹에 묶인다.**
# `cancel-in-progress: true` 와 만나면 이렇게 된다 :
#   - 주간 보안 스캔(gitleaks 전체 이력 · Trivy)이 도는 중에 main 푸시가 하나 들어오면
#     **스캔이 조용히 취소되고 다음 주까지 재시도가 없다.** 아무도 알아채지 못한다
#   - 반대로 cron 이 뜨면 진행 중이던 푸시 CI 가 죽는다. 이쪽도 재실행해 주는 사람이 없다
#   - "급하면 workflow_dispatch 로 즉시" 라는 탈출구가 바로 이 충돌에 제일 잘 걸린다
# 이벤트별로 레인을 나누면 연속 푸시 취소라는 원래 의도는 그대로 두면서 이 사고만 없앤다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # 시크릿 스캔 도구 - 버전과 체크섬을 함께 고정함(공급망)
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  backend:
    name: backend (test + build + 케이스 수 하한)
    # 변경마다 도는 잡이다. 주간 스케줄에서는 뺀다 - 코드가 그대로인데 다시 돌 이유가 없다
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 런타임 버전 대조(이관-8)
        run: bash scripts/check-runtime-versions.sh java
      - name: mvnw verify (test + build)
        working-directory: backend
        run: ./mvnw -B verify
      - name: 케이스 수 하한
        run: bash scripts/check-case-floor.sh backend
      # docs 잡이 아니라 여기다. JUnit 은 pom.xml 에 없고 Spring Boot BOM 이 관리해서,
      # m2 가 채워진 뒤(= verify 뒤)에만 실제 값을 읽을 수 있음. docs 잡은 checkout + bash 뿐임
      - name: 문서 버전 주장 대조
        run: bash scripts/check-doc-versions.sh

  frontend:
    name: frontend (lint + test + build + 케이스 수 하한)
    # 변경마다 도는 잡이다. 주간 스케줄에서는 뺀다 - 코드가 그대로인데 다시 돌 이유가 없다
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 런타임 버전 대조(이관-8)
        run: bash ../scripts/check-runtime-versions.sh node
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test -- --reporter=json --outputFile=vitest-report.json
      - name: Build (tsc + vite)
        run: npm run build
      - name: 케이스 수 하한
        # 스크립트가 스스로 저장소 루트로 이동하므로 frontend/ 에서 실행해도 같음
        run: bash ../scripts/check-case-floor.sh frontend

  docker:
    name: docker (백엔드 이미지 빌드)
    # 변경마다 도는 잡이다. 주간 스케줄에서는 뺀다 - 코드가 그대로인데 다시 돌 이유가 없다
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드(푸시 없음)
        # 배포 산출물이 조용히 썩는 것을 막음 - pom·소스 구조가 바뀌어 Dockerfile 이 깨지면
        # 정작 배포하는 날이 아니라 여기서 먼저 드러남
        run: docker build -t rag-chatbot-backend:ci backend

  # 종전에는 contract · docs 두 잡이었다. 둘 다 checkout + bash 뿐이고 **각각 5초**인데,
  # Actions 는 잡마다 1분 단위로 올림 과금하므로 55초씩 두 번을 버리고 있었다(#129).
  # 합쳐도 10초라 여전히 1분이라, 실행당 1분이 그대로 절약된다.
  #
  # **무거운 잡(backend, 100초 → 2분)에 끼워 넣으면 공짜였는데도 따로 두는 이유**는 실패 신호가
  # 섞이기 때문이다. `mvnw verify` 가 죽으면 그 뒤 문서 검사는 아예 돌지 않아, 「테스트도 깨지고
  # 문서도 깨졌다」와 「테스트만 깨졌다」가 구분되지 않는다. 지금은 잡 이름만 보고 안다.
  #
  # **스텝은 합치지 않고 셋 다 남긴다.** 어느 검사가 깨졌는지는 스텝 이름으로 드러나야 한다.
  static:
    name: static (셸 구문·분석 · 계약 · 문서 참조 · 섹션 이름)
    # 변경마다 도는 잡이다. 주간 스케줄에서는 뺀다 - 코드가 그대로인데 다시 돌 이유가 없다
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **제일 먼저 본다(#136).** 아래 검사들이 전부 셸 스크립트라, 그중 하나에 구문 오류가
      # 있으면 그 검사만 죽고 나머지는 통과해 **부분적인 초록불**이 나온다. 종전에는 셸을
      # 보는 게이트가 아예 없어 `deploy.sh` 를 고쳐도 어떤 잡도 그 파일을 읽지 않았다
      - name: 셸 구문 검사
        run: bash scripts/check-shell-syntax.sh
      # **러너에 shellcheck 가 기본 설치돼 있다** - 설치 스텝이 필요 없다(#145).
      # 스크립트는 도구가 없으면 exit 0 으로 빠지므로, 러너가 바뀌어 사라져도 CI 가
      # 빨간불이 되지는 않는다. 대신 그때는 이 스텝이 "모름"을 찍고 지나간다
      - name: 셸 정적 분석 (shellcheck)
        run: bash scripts/check-shell-lint.sh
      - name: DTO · resultMap · 프론트 타입의 필드 대조
        run: bash scripts/check-response-contract.sh
      - name: 문서 참조 실재 + 위키링크 검사
        run: bash scripts/check-doc-refs.sh
      # 경로가 아니라 **섹션 이름**을 본다. 위 검사는 파일이 있으면 통과하므로 없는 섹션을 가리켜도
      # 초록이었다(#28 에서 실제로 통과했다). grep 기반이라 이 잡의 JDK·Node 없는 환경에서도 돈다
      - name: 문서 섹션 이름 대조
        run: bash scripts/check-doc-sections.sh

  secrets:
    name: secrets (시크릿 스캔)
    # **변경마다 다시 돌린다(#135).** 종전에는 주 1회였고(#127) 근거는 "Actions 분이 유료 한도에 묶인다" 였다.
    # 2026-09-11 공개 전환으로 **그 근거가 사라졌다** -
    # 공개 저장소는 standard runner 분이 무료다.
    #
    # 게다가 공개 저장소는 **시크릿이 한 번 들어오면 회수가 불가능하다.** 비용이 0 이 된 동시에
    # 놓쳤을 때의 대가는 커졌으므로, 이 잡이야말로 merge 전에 돌아야 한다.
    #
    # **schedule 은 그대로 둔다.** 이 잡은 우리 커밋이 아니라 **바깥(취약점 DB · 커밋 이력
    # 전체)이 바뀔 때도** 결과가 달라진다 - PR 마다 도는 것과 주간 실행은 서로 다른 것을 잡는다.
    #
    # **부작용 하나(#135)** : 이제 PR 레인에서도 돌므로 force-push 시 `cancel-in-progress` 가
    # 이력 전체 스캔을 중간에 끊는다. 새 푸시가 곧바로 다시 돌리므로 실해는 없다 -
    # 위 concurrency 주석이 경고한 "취소되고 재시도가 없다"는 **schedule 레인** 이야기다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git 이력을 훑으므로 얕은 클론이면 PR 커밋을 못 봄
          fetch-depth: 0
      - name: gitleaks 설치(버전 · 체크섬 고정)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 시크릿 스캔(커밋된 내용 전체)
        run: ./gitleaks git . --no-banner --redact

  deps-backend:
    name: deps (백엔드 의존성 취약점)
    # **변경마다 다시 돌린다(#135).** 종전에는 주 1회였고(#127) 근거는 "Actions 분이 유료 한도에 묶인다" 였다.
    # 2026-09-11 공개 전환으로 **그 근거가 사라졌다.**
    #
    # 의존성을 **바꾸는 것은 우리 커밋**이다. 취약한 패키지를 새로 들이는 순간 걸려야 하는데,
    # 주 1회면 최대 일주일을 모르고 지낸다.
    #
    # **schedule 도 그대로 둔다.** 코드가 그대로여도 **취약점 DB 가 바뀌면** 답이 달라지기
    # 때문이다 - PR 마다 도는 것과 주간 실행은 서로 다른 것을 잡는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - pom.xml 스캔
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          # 해석한 패키지를 로그에 남김 - 이게 없으면 "취약점 0건"과
          # "패키지를 한 건도 해석하지 못함"이 로그에서 구분되지 않음
          list-all-pkgs: 'true'

  deps-frontend:
    name: deps (프론트 의존성 취약점)
    # **변경마다 다시 돌린다(#135).** 종전에는 주 1회였고(#127) 근거는 "Actions 분이 유료 한도에 묶인다" 였다.
    # 2026-09-11 공개 전환으로 **그 근거가 사라졌다.**
    #
    # 의존성을 **바꾸는 것은 우리 커밋**이다. 취약한 패키지를 새로 들이는 순간 걸려야 하는데,
    # 주 1회면 최대 일주일을 모르고 지낸다.
    #
    # **schedule 도 그대로 둔다.** 코드가 그대로여도 **취약점 DB 가 바뀌면** 답이 달라지기
    # 때문이다 - PR 마다 도는 것과 주간 실행은 서로 다른 것을 잡는다.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high 이상 0건)
        run: npm audit --audit-level=high
